<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BMI Calculator</title>
    <style>
      .heading {
        text-align: center;
        font-family: Verdana, Geneva, Tahoma, sans-serif;

        padding: 0;
      }

      body {
        background-color: rgb(242, 242, 255);
        margin: 0;
      }
    </style>
  </head>
  <body style="background-color: rgb(242, 242, 255); margin: 0">
    <h2 style="margin: 0px; border: 0px">
      Nutri Life - food and health website
    </h2>
    <br />
    <nav
      style="
        background-color: rgb(255, 255, 255);
        padding: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      "
    >
      <div style="display: flex; gap: 30px">
        <a href="home.html" style="text-decoration: none; color: black">Home</a>
        <a href="Health tools.html" style="text-decoration: none; color: black"
          >Health Tools</a
        >
        <a href="Food database.html" style="text-decoration: none; color: black"
          >Food Database</a
        >
        <a href="Meal planner.html" style="text-decoration: none; color: black"
          >Meal Planner</a
        >
        <a href="Health tips.html" style="text-decoration: none; color: black"
          >Health Tips</a
        >
      </div>
      <div>
        <button
          onclick="window.open('index.html', '_self')"
          style="
            background-color: rgb(255, 255, 255);
            border: 1px solid rgb(0, 0, 0);
            padding: 5px 10px;
            cursor: pointer;
          "
        >
          Logout
        </button>
      </div>
    </nav>
    <div
      style="
        padding: 0px;
        border: 2px solid #ccc;
        background-color: rgb(255, 255, 255);
        border-radius: 5px;
        margin: 75px 350px 10px 350px;
        text-align: center;
      "
    >
      <div class="heading">
        <h2>Health Tools</h2>
        <h5>Measure Your BMI and Daily Calorie Needs</h5>
      </div>
      <div
        style="
          padding: 0px;
          border-color: white;
          margin: 10px;
          text-align: center;
          font-family: Verdana, Geneva, Tahoma, sans-serif;
          position: center;
          padding: 10px 400px 10px 100px;
          left: 20px;
        "
      >
        <form
          style="
            padding: 0px;
            border-color: white;
            display: flex;
            flex-direction: row;
            gap: 10px;
            width: 800px;
            margin: 10px;
            text-align: justify;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            height: 100%;
          "
        >
          <label for="weight">Weight (kg):</label>
          <input
            class="input"
            type="number"
            id="weight"
            placeholder="ex:- 60"
            required
          /><br /><br />
          <label for="height">Height (cm):</label>
          <input
            class="input"
            type="number"
            id="height"
            placeholder="ex:- 170"
            required
          /><br /><br />
        </form>
        <form
          style="
            padding: 0px;
            border-color: white;
            display: flex;
            flex-direction: row;
            gap: 10px;
            width: 800px;
            margin: 10px;
            text-align: justify;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
          "
        >
          <label for="Age">Age (years):</label>
          <input
            class="input"
            type="number"
            id="Age"
            placeholder="ex:- 60"
            required
          /><br /><br />
          <label for="Gender">Gender:</label>
          <select id="Gender" required style="cursor: pointer">
            <option value="" disabled selected>Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
          <br /><br />
        </form>
        <form
          style="
            padding: 0px;
            border-color: white;
            display: flex;
            flex-direction: row;
            gap: 10px;
            width: 800px;
            margin: 10px;
            text-align: justify;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
          "
        >
          <label for="Activity1">Activity Level:</label>
          <select id="Activity1" required style="cursor: pointer">
            <option value="" disabled selected>Select Activity Level</option>
            <option value="Sedentary">Sedentary (little or no exercise)</option>
            <option value="Lightly Active">
              Lightly Active (light exercise/sports 1-3 days/week)
            </option>
            <option value="Moderately Active">
              Moderately Active (moderate exercise/sports 3-5 days/week)
            </option>
            <option value="Very Active">
              Very Active (hard exercise/sports 6-7 days a week)
            </option>
            <option value="Extra Active">
              Extra Active (very hard exercise/sports & physical job or 2x
              training)
            </option></select
          ><br /><br />
        </form>
        <form
          style="
            padding: 0px;
            border-color: white;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 600px;
            margin: 30px;
            text-align: justify;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
          "
        >
          <button
            type="button"
            onclick="window.open('Result.html', '_self')"
            style="
              background-color: #0ca648;
              font-weight: bold;
              cursor: pointer;
            "
          >
            Calculate
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
